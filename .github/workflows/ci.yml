name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TarkamArena.slnx
      - name: Build
        run: dotnet build TarkamArena.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/TarkamArena.Tests -c Release --no-build --logger "console;verbosity=normal"
